server:
  port: 8081

#Configuracion de spring
spring:
  application:
    name: herram

  #Configuracion de migracion
  flyway:
    enabled: true
    baselineVersion: 1
    locations:
      classpath: db/migration
    sqlMigrationSuffixes: .sql
    baselineOnMigrate: true
    sqlMigrationPrefix: V
    schemas: public

  #Configuracion de base de datos
  datasource:
    url: jdbc:postgresql://localhost:5432/herram
    username: postgres
    password: zrjc20
    driverClassName: org.postgresql.Driver
  #configuracion JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  web:
    error:
      include-message: always